name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: svn-docker:ci

jobs:
  build-and-test:
    name: Build image & smoke test
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Lint shell scripts
        run: shellcheck .github/scripts/*.sh

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=svn-docker
          cache-to: type=gha,mode=max,scope=svn-docker

      - name: Start container
        run: |
          docker run --detach --name svn-ci \
            --publish 8080:80 \
            --publish 3690:3690 \
            "$IMAGE"

      - name: Install Subversion client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends subversion

      - name: Run smoke test
        env:
          CONTAINER: svn-ci
          BASE_URL: http://127.0.0.1:8080
          SVN_URL: svn://127.0.0.1:3690
        run: bash .github/scripts/smoke-test.sh

      - name: Show container logs
        if: failure()
        run: docker logs svn-ci || true

      - name: Remove container
        if: always()
        run: docker rm -f svn-ci || true

      - name: Package image for branch build
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          ref="$(awk '/^[[:space:]]*image:/{print $2; exit}' docker-compose.yml | tr -d '\r')"
          image="${ref%:*}"
          version="${ref##*:}"
          branch="${GITHUB_REF_NAME//\//-}"
          branch="${branch//[^0-9A-Za-z._-]/-}"
          branch="${branch:0:60}"
          tag="${image}:${version}-${branch}"
          mkdir -p dist
          docker tag "$IMAGE" "$tag"
          docker save "$tag" | gzip -6 > "dist/${image}-${version}-${branch}-amd64.tar.gz"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          echo "ARTIFACT_NAME=${image}-${version}-${branch}-amd64" >> "$GITHUB_ENV"
          echo "Packaged ${tag}"

      - name: Upload branch build artifact
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          retention-days: 30
