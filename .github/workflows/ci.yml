name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: svn-docker:ci

jobs:
  build-and-test:
    name: Build image & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Lint shell scripts
        run: shellcheck .github/scripts/*.sh

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=svn-docker
          cache-to: type=gha,mode=max,scope=svn-docker

      - name: Start container
        run: |
          docker run --detach --name svn-ci \
            --publish 8080:80 \
            --publish 3690:3690 \
            "$IMAGE"

      - name: Install Subversion client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends subversion

      - name: Run smoke test
        env:
          CONTAINER: svn-ci
          BASE_URL: http://127.0.0.1:8080
          SVN_URL: svn://127.0.0.1:3690
        run: bash .github/scripts/smoke-test.sh

      - name: Show container logs
        if: failure()
        run: docker logs svn-ci || true

      - name: Remove container
        if: always()
        run: docker rm -f svn-ci || true
